[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitvm-arena"
version = "0.3.0"
description = "Replayable BitVM protocol games and an independent ControlArena setting"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Patrick Dugan"}]
dependencies = []

[project.optional-dependencies]
control = ["control-arena==20.1.1", "inspect-ai==0.3.252", "agent-client-protocol==0.12.0"]

[project.scripts]
bitvm-arena = "bitvm_arena.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bitvm_arena = ["data/*.json"]
