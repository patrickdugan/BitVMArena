name: BitVM Arena

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: bitvm-arena benchmark --output runs/calibration

  control-arena:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[control]'
      - run: python -m unittest discover -s tests -p test_control_arena.py -v

  authority-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: patrickdugan/bitcoin-rs
          ref: 29ca519031fcd67f467881e16ba73e0eb1211759
          path: .deps/bitcoin-rs
      - run: python research/authority_enumeration/replay.py --bitcoin-rs .deps/bitcoin-rs --out runs/authority
      - run: python -m unittest discover -s research/authority_enumeration/upstream/scripts/tests -p test_bitvm_authority_enumeration.py -v
        env:
          CPA_SOURCE: ${{ github.workspace }}/.deps/bitcoin-rs

  corpus:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    defaults:
      run:
        working-directory: corpus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m bitvm_corpus validate
      - name: Audit the saved Core 31.1 evidence offline
        run: |
          for track in primitive bitvm3 bitvm3-iob bitvm2 bitvm3-m14 bitvm3-setup; do
            python -m bitvm_corpus native audit "examples/native/$track-core31.1.json"
          done
      - name: Audit the saved ssh-fleet reports and compare them with the local run
        run: |
          for report in examples/native/bitvm3-setup-ssh-fleet*.json; do
            [ -e "$report" ] || continue
            python -m bitvm_corpus native audit "$report"
            python tools/compare_setup_reports.py examples/native/bitvm3-setup-core31.1.json "$report" --ssh-roles garbler,desk,guardian,watch
          done
      - name: Audit the saved episode reports offline
        run: |
          for report in examples/episodes/reports/*.json; do
            python -m bitvm_corpus native audit "$report"
          done
      - run: python -m bitvm_corpus native assess --app iob-payout-desk
      - name: Audit the saved testnet4 staging reports offline
        run: |
          for report in examples/testnet4/*.json; do
            [ -e "$report" ] || continue
            python -m bitvm_corpus testnet4 audit "$report"
          done

  corpus-regtest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corpus
    env:
      CORE_VERSION: '31.1'
      # From https://bitcoincore.org/bin/bitcoin-core-31.1/SHA256SUMS
      CORE_SHA256: b80d9c3e04da78fb6f0569685673418cf686fadba9042d926d13fb87ff503f9e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch checksum-pinned Bitcoin Core
        run: |
          archive="bitcoin-$CORE_VERSION-x86_64-linux-gnu.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://bitcoincore.org/bin/bitcoin-core-$CORE_VERSION/$archive"
          echo "$CORE_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" "bitcoin-$CORE_VERSION/bin/bitcoind"
          echo "BITVM_ARENA_BITCOIND=$RUNNER_TEMP/bitcoin-$CORE_VERSION/bin/bitcoind" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests -p 'test_native.py' -v
      - run: python -m unittest discover -s tests -p 'test_episode.py' -v
      - run: python -m unittest discover -s tests -p 'test_m14.py' -v
      - run: python -m unittest discover -s tests -p 'test_ceremony.py' -v
      - run: python -m unittest discover -s tests -p 'test_testnet4.py' -v
      - name: Rehearse every testnet4 row on regtest (blocks on a timer, every third a reorg, cases concurrent)
        run: |
          mkdir -p reports
          python -m bitvm_corpus testnet4 rehearse --row bitvm3-testnet4 --reorg-every 3 --output reports/testnet4-rehearsal-linux.json
          python -m bitvm_corpus testnet4 audit reports/testnet4-rehearsal-linux.json
          python -m bitvm_corpus testnet4 rehearse --row bitvm3-iob-testnet4 --reorg-every 3 --output reports/testnet4-iob-rehearsal-linux.json
          python -m bitvm_corpus testnet4 audit reports/testnet4-iob-rehearsal-linux.json
      - name: Rerun every example episode and audit it
        run: python tools/rebuild_episode_reports.py --bitcoind "$BITVM_ARENA_BITCOIND"
      - name: Run every native track on regtest and audit the reports
        run: |
          mkdir -p reports
          for track in primitive bitvm3 bitvm3-iob bitvm2 bitvm3-m14 bitvm3-setup; do
            python -m bitvm_corpus native run --track "$track" --output "reports/$track-core$CORE_VERSION-linux.json"
            python -m bitvm_corpus native audit "reports/$track-core$CORE_VERSION-linux.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-native-reports
          path: corpus/reports/
          if-no-files-found: ignore

  corpus-ssh-fleet:
    # bitvm3-setup with four parties in containers reached over ssh (tools/ssh_fleet.sh),
    # the relay local: keeps the ssh host path tested.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corpus
    env:
      CORE_VERSION: '31.1'
      # From https://bitcoincore.org/bin/bitcoin-core-31.1/SHA256SUMS
      CORE_SHA256: b80d9c3e04da78fb6f0569685673418cf686fadba9042d926d13fb87ff503f9e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch checksum-pinned Bitcoin Core
        run: |
          archive="bitcoin-$CORE_VERSION-x86_64-linux-gnu.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://bitcoincore.org/bin/bitcoin-core-$CORE_VERSION/$archive"
          echo "$CORE_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" "bitcoin-$CORE_VERSION/bin/bitcoind"
          echo "BITVM_ARENA_BITCOIND=$RUNNER_TEMP/bitcoin-$CORE_VERSION/bin/bitcoind" >> "$GITHUB_ENV"
      - name: Start the ssh fleet (one container per party, throwaway key)
        run: bash tools/ssh_fleet.sh up "$RUNNER_TEMP/fleet"
      - name: Run bitvm3-setup over ssh, audit it and compare it with the committed local run
        run: |
          mkdir -p reports
          fleet="$RUNNER_TEMP/fleet"
          report=reports/bitvm3-setup-ssh-fleet-linux.json
          python -m bitvm_corpus native run --track bitvm3-setup $(cat "$fleet/hosts.args") --ssh-config "$fleet/ssh_config" --output "$report"
          python -m bitvm_corpus native audit "$report"
          python tools/compare_setup_reports.py examples/native/bitvm3-setup-core31.1.json "$report" --ssh-roles garbler,desk,guardian,watch
      - name: Stop the fleet
        if: always()
        run: bash tools/ssh_fleet.sh down "$RUNNER_TEMP/fleet"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-ssh-fleet-report
          path: corpus/reports/
          if-no-files-found: ignore
